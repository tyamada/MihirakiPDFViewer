name: Bug report
description: Report a reproducible problem with MihirakiPDFViewer
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MihirakiPDFViewer.
        Do not attach the PDF itself or include document contents, file names, names, or other personal information.

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that consistently cause the problem.
      placeholder: |
        1. Open …
        2. Change …
        3. Tap …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Unknown
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.0.0 (1)"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "iPadOS 27.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPad Pro"
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Relevant viewing settings
      description: Include settings such as spread view, cover page, reading direction, and single-page portrait mode.

  - type: textarea
    id: diagnostics
    attributes:
      label: Screenshots and diagnostics
      description: Add privacy-checked screenshots, app logs, or device test results if helpful.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirmed that this report and its attachments contain no document contents, file names, names, or other personal information.
          required: true
